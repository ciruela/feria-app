<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accedé a Armenext</title>
</head>
<body style="margin:0;padding:0;background-color:#0D0B0A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#0D0B0A;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background-color:#1A1613;border:1px solid #2C2721;border-radius:8px;">
          <tr>
            <td align="center" style="padding:32px 28px 8px;">
              <img src="https://app.armenext.com/email/armenext-lockup.png" alt="Armenext" width="168" height="40" style="display:block;border:0;max-width:168px;height:auto;" />
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 28px;color:#EDE7DE;font-size:15px;line-height:1.55;">
              <h1 style="margin:0 0 12px;font-size:22px;font-weight:800;">Accedé a Armenext</h1>
              <p style="margin:0 0 16px;">Recibimos una solicitud para iniciar sesión con <strong>{{ .Email }}</strong>. Tocá el botón para continuar.</p>
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:24px 0;">
                <tr>
                  <td align="center" style="border-radius:4px;background-color:#E2622F;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 28px;font-size:14px;font-weight:700;color:#3D1607;text-decoration:none;">INICIAR SESIÓN</a>
                  </td>
                </tr>
              </table>
              <p style="margin:16px 0 0;color:#9A9088;font-size:13px;">Si no fuiste vos, ignorá este correo.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px 28px;border-top:1px solid #2C2721;color:#9A9088;font-size:12px;">
              Enviado por <strong style="color:#EDE7DE;">Armenext</strong> · plataforma para armerías
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
