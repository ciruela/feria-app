# Configuración del proyecto Supabase (AR-24 / AR-21).
#
# Fija verify_jwt por función para que la protección NO dependa del default
# del CLI. Todas requieren un JWT válido en el gateway (la anon key es un JWT
# válido con rol anon para las funciones públicas de la tienda / portal).
project_id = "ihotjvimurztbhrsiabs"

[functions.platform-metrics]
verify_jwt = true

[functions.register-tenant-subdomain]
verify_jwt = true

[functions.invite-team-member]
verify_jwt = true

[functions.remove-team-member]
verify_jwt = true

[functions.storefront-catalog]
verify_jwt = true

[functions.storefront-order]
verify_jwt = true

[functions.seller-portal-validate]
verify_jwt = true

# Templates de email (solo local / self-hosted CLI).
# En producción: ./scripts/apply_supabase_email_templates.sh
[auth.email.template.confirmation]
subject = "Confirmá tu cuenta en Armenext"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Tu enlace de acceso a Armenext"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Restablecer contraseña — Armenext"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Te invitaron a Armenext"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirmá tu nuevo email — Armenext"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Tu código de verificación — Armenext"
content_path = "./supabase/templates/reauthentication.html"
