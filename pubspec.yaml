name: app_feria
description: Catálogo de precios para feria de armas, caza y pesca.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  excel: ^4.0.6
  file_picker: ^11.0.2
  google_mlkit_text_recognition: ^0.15.0
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  provider: ^6.1.2
  share_plus: ^11.0.0
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.16.0
  crypto: ^3.0.7
  sentry_flutter: ^9.26.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Íconos de app (Armenext). Regenerar: dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  remove_alpha_ios: true
  image_path_ios: "assets/branding/icons/ios-1024.png"
  android: "ic_launcher"
  image_path_android: "assets/branding/icons/android-legacy-512.png"
  adaptive_icon_background: "assets/branding/icons/android-bg-432.png"
  adaptive_icon_foreground: "assets/branding/icons/android-fg-432.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/products.json
    - assets/data/sellers.json
    - assets/images/
    - assets/branding/
    - assets/branding/armenext/
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Variable.ttf
          weight: 500
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
