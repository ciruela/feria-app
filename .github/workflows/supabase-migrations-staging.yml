name: Supabase Migrations (Staging)

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Archivo en supabase/migrations/ (vacío = todas pendientes manual)'
        required: false
        default: ''
  push:
    branches: [staging]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations-staging.yml'
      - 'scripts/apply_supabase_migration.sh'

concurrency:
  group: supabase-migrations-staging
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration SQL to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_REF }}
          MIGRATION_FILE: ${{ github.event.inputs.migration_file }}
        run: |
          set -euo pipefail
          if [[ -z "${PROJECT_REF:-}" ]]; then
            echo "::error::Falta secret SUPABASE_STAGING_REF (edwpfzdhitlnvewubebx)"
            exit 1
          fi
          chmod +x scripts/apply_supabase_migration.sh
          if [[ -n "${MIGRATION_FILE:-}" ]]; then
            ./scripts/apply_supabase_migration.sh "supabase/migrations/${MIGRATION_FILE}"
          else
            echo "Sin migration_file: correr manualmente o indicar archivo."
            exit 0
          fi
