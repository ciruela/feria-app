name: Deploy Tenant Subdomain Worker

# Opcional: requiere CLOUDFLARE_API_TOKEN con Workers Scripts → Edit.
# Sin ese permiso usá Register Tenant Domains (API Pages) + edge function.
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-tenant-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker (feria-tenant-subdomains)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: cloudflare/tenant-subdomain-proxy
