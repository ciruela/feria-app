# DEPLOY: compila y sube a TestFlight SOLO al mergear a main (cambios de app).
# El trabajo en branches/PRs nunca dispara esto (lo valida CI + SonarCloud).
# Flujo GitOps: branch -> PR (CI/Sonar) -> merge a main -> deploy a TestFlight.
#
# Secrets en GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_PRIVATE_KEY   (contenido completo del .p8)
#   APP_STORE_CERTIFICATE_KEY       (clave privada RSA 2048 PEM para certificado de distribución)
#
# Billing: job `build` = macos-26 (~8 min, ×10). Job `distribute` = ubuntu (~5–25 min, ×1).

name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      # OJO: no incluir este archivo. Si se lista, editar el propio workflow
      # (aunque sea un comentario) dispara un deploy innecesario. Para probar
      # cambios en el pipeline, usar "Run workflow" (workflow_dispatch).
  workflow_dispatch:
    inputs:
      skip_distribute:
        description: 'Solo compilar y subir (sin grupos/revisión beta)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}

    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CERTIFICATE_KEY: ${{ secrets.APP_STORE_CERTIFICATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          missing=0
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
                      APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CERTIFICATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Falta el secret $name en GitHub Actions"
              missing=1
            fi
          done
          exit "$missing"

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Verify Xcode / iOS SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iOS'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build number
        id: version
        run: |
          BUILD=$(( ${{ github.run_number }} + 10 ))
          perl -pi -e "s/^version: .*/version: 1.0.0+${BUILD}/" pubspec.yaml
          echo "Build number: ${BUILD}"
          grep '^version:' pubspec.yaml
          echo "build_number=${BUILD}" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Install Codemagic CLI
        run: pipx install codemagic-cli-tools

      - name: Fetch signing files
        run: |
          keychain initialize
          app-store-connect fetch-signing-files com.armeria.feria.appFeria \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@env:APP_STORE_CERTIFICATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build IPA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DART_DEFINES=""
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_ANON_KEY" ]]; then
            DART_DEFINES="--dart-define=SUPABASE_URL=${SUPABASE_URL} --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          fi
          # shellcheck disable=SC2086
          flutter build ipa \
            --export-options-plist="$HOME/export_options.plist" \
            $DART_DEFINES
          ls -la build/ios/ipa/
          test -n "$(ls build/ios/ipa/*.ipa 2>/dev/null)"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: build/ios/ipa/app_feria.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          wait-for-processing: 'false'

      - name: Save IPA for distribution job
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_id }}
          path: build/ios/ipa/*.ipa
          retention-days: 3

  distribute:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_distribute != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      TESTFLIGHT_EXTERNAL_GROUP: Mundo escopeta ext

    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-${{ github.run_id }}
          path: ipa

      - name: Install Codemagic CLI
        run: pipx install codemagic-cli-tools

      - name: Submit to external beta group and review
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while [[ "$attempt" -le "$max_attempts" ]]; do
            echo "Intento ${attempt}/${max_attempts}..."
            if app-store-connect publish \
              --skip-package-upload \
              --path "ipa/*.ipa" \
              --testflight \
              --expire-build-submitted-for-review \
              --max-find-build-wait 15 \
              --max-build-processing-wait 25 \
              --beta-group "$TESTFLIGHT_EXTERNAL_GROUP" \
              --beta-build-localizations '[{"locale": "es-MX", "whats_new": "Build automático desde GitHub Actions (main)."}]'; then
              echo "Build asignado a '$TESTFLIGHT_EXTERNAL_GROUP' y enviado a revisión beta."
              exit 0
            fi
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "::error::No se pudo distribuir el build tras ${max_attempts} intentos."
              exit 1
            fi
            echo "Reintentando en 90 segundos..."
            sleep 90
            attempt=$((attempt + 1))
          done

  pipeline-status:
    needs: [build, distribute]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resumen del pipeline
        run: |
          echo "## Pipeline iOS TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build (macOS): **${{ needs.build.result }}** — build +${{ needs.build.outputs.build_number }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.distribute.result }}" == "skipped" ]]; then
            echo "- Distribución TestFlight: **omitida** (workflow_dispatch con skip_distribute)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Distribución TestFlight: **${{ needs.distribute.result }}** — grupo externo + revisión beta" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::El build falló. La app NO se subió a TestFlight."
            exit 1
          fi
          if [[ "${{ needs.distribute.result }}" == "failure" ]]; then
            echo "::warning::El IPA se subió, pero falló la distribución a testers externos. Reintentá el workflow desde Actions."
            exit 1
          fi
          echo "Pipeline completo OK."
