name: CI

# Validación (analyze + tests) en cada PR y al llegar a main.
# No compila ni sube nada a Apple: eso lo hace "iOS TestFlight" solo en main.
# Trabajás en un branch -> abrís PR (corre acá) -> merge a main (corre + deploy).
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/**'
      - 'supabase/**'
      - 'scripts/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Repo hygiene (functions/config coverage)
        run: |
          chmod +x scripts/check_repo_hygiene.sh
          ./scripts/check_repo_hygiene.sh

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          shellcheck -S warning scripts/*.sh || true
