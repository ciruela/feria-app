sonar.organization=ciruela
sonar.projectKey=ciruela_feria-app
sonar.projectName=Feria App

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Cobertura generada por `flutter test --coverage` (LCOV).
sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.coverage.dartlcov.reportPath=coverage/lcov.info

# Excluir generado/artefactos del analisis y de la cobertura.
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,build/**,web-storefront/**,supabase/**

# Cobertura: se mide sobre logica pura (models, utils, services de calculo).
# Se excluye UI (screens/widgets/theme) y adaptadores de I/O que requieren
# device/mocks de red para testear con sentido (repos Supabase, OCR, PDF,
# excel, foto, auth/session, sync y servicios que solo envuelven a esos).
sonar.coverage.exclusions=\
  test/**,\
  **/*.g.dart,\
  lib/main.dart,\
  lib/theme/**,\
  lib/screens/**,\
  lib/widgets/**,\
  lib/services/supabase_*.dart,\
  lib/services/dni_ocr_service.dart,\
  lib/services/comprobante_pdf_service.dart,\
  lib/services/product_photo_service.dart,\
  lib/services/excel_catalog_service.dart,\
  lib/services/data_sync_service.dart,\
  lib/services/exchange_rate_service.dart,\
  lib/services/auth_service.dart,\
  lib/services/audit_service.dart,\
  lib/services/sales_metrics_service.dart,\
  lib/services/tenant_session_service.dart,\
  lib/services/catalog_service.dart,\
  lib/services/seller_service.dart,\
  lib/services/admin_service.dart,\
  lib/services/team_service.dart,\
  lib/utils/presupuesto_pdf.dart,\
  lib/utils/presupuesto_exporter.dart,\
  lib/utils/uppercase_input.dart,\
  lib/models/budget_customer_controllers.dart
